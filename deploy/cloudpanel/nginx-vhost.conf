# Campus PSPV — blocs del vhost de Nginx per a CloudPanel (Moodle 5.3).
#
# A CloudPanel: lloc → Vhost. Parteix del vhost que genera la plantilla
# "Generic" o "Laravel 12" (PHP 8.4) i canvia-hi només això, dins el bloc
# `server` intern (el que escolta al port 8080):
#
#   1. `root`: ha d'apuntar a la carpeta public/ de Moodle, no a l'arrel:
#
#        root /home/<usuari>/htdocs/<domini>/moodle/public;
#
#   2. Substitueix els blocs `location /` i `location ~ \.php$` pels d'aquí
#      sota. Deixa tal com estan els marcadors {{...}} que hi posa CloudPanel.
#
# Per què: Moodle 5.x envia a r.php tot el que no és un fitxer (router) i fa
# servir "slash arguments" (/pluginfile.php/123/…), que necessiten PATH_INFO.

client_max_body_size 512M;

location / {
    try_files $uri $uri/ /r.php;
}

location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    try_files $fastcgi_script_name =404;
    include fastcgi_params;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_intercept_errors on;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
}
