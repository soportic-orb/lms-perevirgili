# Campus PSPV — vhost de Nginx per a CloudPanel (Moodle 5.3).
#
# A CloudPanel: lloc → Vhost. Substitueix-ne tot el contingut per aquest i
# canvia-hi:
#
#   - <domini>  pel domini del lloc (2 vegades);
#   - <usuari>  per l'usuari del lloc, no per un usuari SSH addicional (2 vegades).
#
# Deixa tal com estan les línies `listen` que ja tingui el teu vhost (poden
# variar amb la versió de CloudPanel) i els marcadors {{...}}, que omple
# CloudPanel.
#
# El vhost de CloudPanel té dos blocs `server`:
#
#   1. El públic (ports 80 i 443): només reenvia les peticions al segon.
#      No hi posis cap bloc que serveixi fitxers estàtics per extensió
#      (css, js, png…): Moodle serveix molts fitxers amb adreces com
#      /lib/javascript.php/…/x.js o /pluginfile.php/…/foto.png, que no són
#      fitxers del disc, i el campus es veuria sense estils ni imatges.
#   2. L'intern (port 8080): executa PHP. Els ajustos de Moodle van aquí.
#
# Què necessita Moodle 5.x del segon bloc:
#
#   - Tot el que no és un fitxer va a r.php (l'encaminador).
#   - «Slash arguments»: adreces com /theme/styles.php/pspv/123/all, on el
#     que ve després de .php s'ha de passar a PHP com a PATH_INFO.
#     ATENCIÓ: `try_files` buida $fastcgi_path_info. Per això es desa abans
#     a $path_info. Sense això, styles.php respon 404 i la web es veu sense
#     format.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name <domini>;
  root /home/<usuari>/htdocs/<domini>/moodle/public;

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  client_max_body_size 512M;

  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name <domini>;
  root /home/<usuari>/htdocs/<domini>/moodle/public;

  include /etc/nginx/global_settings;

  client_max_body_size 512M;
  index index.php index.html;

  location / {
    try_files $uri $uri/ /r.php;
  }

  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    set $path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;
    include fastcgi_params;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $path_info;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_intercept_errors on;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }
}
